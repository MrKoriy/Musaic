name: CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "MusaicApp/**"
      - "deploy/**"
      - "deploy-server.sh"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "MusaicApp/**"
      - "deploy/**"
      - "deploy-server.sh"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pin the toolchain for macOS jobs (ignored on Linux): the Liquid Glass .icon
  # format needs actool from Xcode 26.6+, and Swift 6.2 concurrency rules must
  # match local dev.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/.bun-version
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Tests
        run: bun run test:coverage

  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint

  sidecar:
    name: Sidecar Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sidecar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/sidecar/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile ./*.py
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No sidecar tests directory; skipping."
          fi

  shell:
    name: Shell & Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shopt -s nullglob
          shellcheck --severity=warning deploy-server.sh server/scripts/*.sh server/sidecar/*.sh
      - name: actionlint
        uses: raven-actions/actionlint@v2

  app-build-macos:
    name: macOS App Build (${{ matrix.configuration }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MusaicApp
        run: xcodegen generate
      - name: Build macOS app
        working-directory: MusaicApp
        run: >-
          xcodebuild -project Musaic.xcodeproj -scheme MusaicMac
          -configuration ${{ matrix.configuration }}
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  app-tests-macos:
    name: Swift Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MusaicApp
        run: xcodegen generate
      - name: Run unit tests
        working-directory: MusaicApp
        run: >-
          xcodebuild test -project Musaic.xcodeproj -scheme MusaicMac -configuration Debug
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

  app-build-ios:
    name: iOS App Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MusaicApp
        run: xcodegen generate
      - name: Build iOS app (with widget extension)
        working-directory: MusaicApp
        run: >-
          xcodebuild -project Musaic.xcodeproj -scheme Musaic -configuration Debug
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  app-build-watchos:
    name: watchOS App Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MusaicApp
        run: xcodegen generate
      - name: Build watch app
        working-directory: MusaicApp
        run: >-
          xcodebuild -project Musaic.xcodeproj -scheme MusaicWatch -configuration Debug
          -destination 'generic/platform=watchOS' CODE_SIGNING_ALLOWED=NO build
