version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      server-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /server/sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      sidecar-minor:
        update-types: [minor, patch]
