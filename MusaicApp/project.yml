name: Musaic
options:
  bundleIdPrefix: com.leonid
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Musaic:
    type: application
    platform: iOS
    sources:
      - Models
      - Services
      - Stores
      - Views
      - MusaicApp.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          # Plain-HTTP server on a public IP (no domain for a trusted cert yet).
          # Re-enable strict ATS once TLS is configured on the server.
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            45-146-167-109.nip.io:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 72BG7PXY8J
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.leonid.musaic

  MusaicMac:
    type: application
    platform: macOS
    sources:
      - Models
      - Services
      - Stores
      - Views
      - MusaicApp.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info-macOS.plist
      properties:
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          # Plain-HTTP server on a public IP (no domain for a trusted cert yet).
          # Re-enable strict ATS once TLS is configured on the server.
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            45-146-167-109.nip.io:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 72BG7PXY8J
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.leonid.musaic.mac.dev
        ENABLE_APP_SANDBOX: NO
