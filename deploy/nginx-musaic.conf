# Dedicated Musaic origin; keep other VPS virtual hosts unchanged.
# Certificate is provisioned separately with certbot certonly --webroot.
server {
    listen 80;
    listen [::]:80;
    server_name musaic.94-103-1-126.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/musaic-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musaic.94-103-1-126.sslip.io;

    ssl_certificate /etc/letsencrypt/live/musaic.94-103-1-126.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musaic.94-103-1-126.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Avoid logging bearer/query credentials used by audio URLs.
    access_log off;
    error_log /var/log/nginx/musaic-error.log warn;

    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        # Pass audio ranges and SSE promptly; no proxy caching of private data.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}
